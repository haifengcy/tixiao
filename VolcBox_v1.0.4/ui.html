        if (!str) return '';
        return str.charAt(0).toUpperCase() + str.slice(1);
      },

      formatWordToken(token, isFirstWord = false, isTitle = false, isEnglish = true) {
        if (!token) return '';
        if (/^[{%$#@<]/.test(token) || /[%}>]$/.test(token)) return token;

        const match = token.match(/^([^a-zA-Z\u00C0-\u024F\u0400-\u04FF]*)(.*?)([^a-zA-Z\u00C0-\u024F\u0400-\u04FF]*)$/);
        if (!match) return token;

        const prefix = match[1] || '';
        const core = match[2] || '';
        const suffix = match[3] || '';

        if (!core) return token;

        const lower = core.toLowerCase();

        // 1. Check Acronyms
        if (this.acronymMap[lower]) {
          return prefix + this.acronymMap[lower] + suffix;
        }

        // 2. English Pronoun "I" and contractions
        if (isEnglish) {
          if (lower === 'i') return prefix + 'I' + suffix;
          if (lower === "i'm" || lower === "i’m") return prefix + "I'm" + suffix;
          if (lower === "i'll" || lower === "i’ll") return prefix + "I'll" + suffix;
          if (lower === "i've" || lower === "i’ve") return prefix + "I've" + suffix;
          if (lower === "i'd" || lower === "i’d") return prefix + "I'd" + suffix;
        }

        // 3. Proper Nouns
        if (this.properNounMap[lower]) {
          return prefix + this.properNounMap[lower] + suffix;
        }

        // 4. In Title / Button Phrase (English Title Case)
        if (isTitle && isEnglish) {
          if (!isFirstWord && this.titleMinorWords.has(lower)) {
            return prefix + lower + suffix;
          }
          return prefix + this.capitalize(lower) + suffix;
        }

        // 5. First word of sentence or single word
        if (isFirstWord) {
          return prefix + this.capitalize(lower) + suffix;
        }

        // 6. Non-first word in sentence: keep lowercase
        return prefix + lower + suffix;
      },

      formatSentence(sentence, isEnglish) {
        if (!sentence) return '';
        const tokens = sentence.split(/(\s+)/);
        let hasFoundFirstWord = false;

        return tokens.map(token => {
          if (!token || /^\s+$/.test(token)) return token;

          const isFirst = !hasFoundFirstWord;
          if (/[a-zA-Z\u00C0-\u024F\u0400-\u04FF]/.test(token)) {
            hasFoundFirstWord = true;
          }

          return this.formatWordToken(token, isFirst, false, isEnglish);
        }).join('');
      },

      formatPlainText(text, targetLang) {
        if (!text || typeof text !== 'string') return text;
        const lines = text.split('\n');

        return lines.map(line => {
          const trimmed = line.trim();
          if (!trimmed) return line;

          const isEnglish = (targetLang || '').toLowerCase().startsWith('en');

          if (!/[a-zA-Z\u00C0-\u024F\u0400-\u04FF]/.test(trimmed)) {
            return line.replace(/\b([a-zA-Z]{2,5})\b/g, (match) => {
              const lower = match.toLowerCase();
              return this.acronymMap[lower] || this.properNounMap[lower] || match;
            });
          }

          const words = trimmed.split(/\s+/).filter(Boolean);
          const wordCount = words.length;

          // 1. Single Word
          if (wordCount === 1) {
            const formatted = this.formatWordToken(trimmed, true, true, isEnglish);
            return line.replace(trimmed, formatted);
          }

          // 2. Determine if it's a Sentence or Short UI Label/Title
          const endsWithSentencePunct = /[.!?。！？]$/.test(trimmed);
          const hasSentenceBreak = /[.!?。！？]\s+[a-zA-Z\u00C0-\u024F\u0400-\u04FF]/.test(trimmed);
          const isSentence = hasSentenceBreak || (endsWithSentencePunct && wordCount > 3) || wordCount > 6;

          if (!isSentence) {
            if (isEnglish) {
              const tokens = trimmed.split(/(\s+)/);
              const meaningfulWords = tokens.filter(t => t && !/^\s+$/.test(t));
              const lastMeaningfulIndex = meaningfulWords.length - 1;

              let wordIdx = 0;
              const formatted = tokens.map(token => {
                if (!token || /^\s+$/.test(token)) return token;
                const isFirst = (wordIdx === 0);
                const isLast = (wordIdx === lastMeaningfulIndex);
                wordIdx++;
                return this.formatWordToken(token, isFirst || isLast, true, isEnglish);
              }).join('');
              return line.replace(trimmed, formatted);
            } else {
              const tokens = trimmed.split(/(\s+)/);
              let hasFoundFirst = false;
              const formatted = tokens.map(token => {
                if (!token || /^\s+$/.test(token)) return token;
                const isFirst = !hasFoundFirst;
                if (/[a-zA-Z\u00C0-\u024F\u0400-\u04FF]/.test(token)) hasFoundFirst = true;
                return this.formatWordToken(token, isFirst, false, isEnglish);
              }).join('');
              return line.replace(trimmed, formatted);
            }
          }

          // 3. Full Sentence(s)
          const sentenceRegex = /([^.!?。！？]+(?:[.!?。！？]+|$))/g;
          const sentenceMatches = trimmed.match(sentenceRegex) || [trimmed];

          const formattedSentences = sentenceMatches.map(s => this.formatSentence(s, isEnglish)).join('');
          return line.replace(trimmed, formattedSentences);
        }).join('\n');
      },

      format(text, targetLang) {
        if (!text || typeof text !== 'string') return text;
        if (/<\/?\d+>/.test(text)) {
          const tags = [];
          let plain = '';
          let lastIndex = 0;
          const regex = /<\/?\d+>/g;
          let match;
          while ((match = regex.exec(text)) !== null) {
            plain += text.substring(lastIndex, match.index);
            tags.push({ tag: match[0], plainIndex: plain.length });
            lastIndex = regex.lastIndex;
          }
          plain += text.substring(lastIndex);

          const formattedPlain = this.formatPlainText(plain, targetLang);

          let result = '';
          let prevIndex = 0;
          for (const item of tags) {
            result += formattedPlain.substring(prevIndex, item.plainIndex) + item.tag;
            prevIndex = item.plainIndex;
          }
          result += formattedPlain.substring(prevIndex);
          return result;
        }
        return this.formatPlainText(text, targetLang);
      }
    };

    // =====================================================================
    // 2. MODERN TRANSLATION PIPELINE ARCHITECTURE (Providers & Orchestrator)
    // =====================================================================

    // LRU In-Memory Cache (2000 entries for 0ms repeated word hits)
    class TranslationLRUCache {
      constructor(limit = 2000) {
        this.limit = limit;
        this.cache = new Map();
      }
      get(key) {
        if (!this.cache.has(key)) return undefined;
        const val = this.cache.get(key);
        this.cache.delete(key);
        this.cache.set(key, val);
        return val;
      }
      set(key, val) {
        if (this.cache.has(key)) {
          this.cache.delete(key);
        } else if (this.cache.size >= this.limit) {
          const oldestKey = this.cache.keys().next().value;
          this.cache.delete(oldestKey);
        }
        this.cache.set(key, val);
      }
      has(key) {
        return this.cache.has(key);
      }
    }

    // Tag Shielding & Normalization Engine (Preserves <s id="X"> and <span id="X"> across MT)
    const TagShieldingEngine = {
      unescapeHtml(str) {
        if (!str || typeof str !== 'string') return '';
        return str
          .replace(/&lt;/gi, '<')
          .replace(/&gt;/gi, '>')
          .replace(/&quot;/gi, '"')
          .replace(/&#39;/gi, "'")
          .replace(/&amp;/gi, '&');
      },

      normalizeTags(str) {
        if (!str || typeof str !== 'string') return str;
        let s = this.unescapeHtml(str);
        // Normalize < s id = "0" > or < span id = '0' > to <s id="0">
        s = s.replace(/<\s*(?:s|span)\s+id\s*=\s*["']?(\d+)["']?\s*>/gi, '<s id="$1">');
        // Normalize </ s > or </ span > or < / s > to </s>
        s = s.replace(/<\s*\/\s*(?:s|span)\s*>/gi, '</s>');
        return s;
      },

      repairTags(str) {
        if (!str || typeof str !== 'string') return str;
        let normalized = this.normalizeTags(str);

        // Check if there are unbalanced or unclosed tags
        const openTags = [];
        const tagRegex = /<s id="(\d+)">|<\/s>/g;
        let match;
        while ((match = tagRegex.exec(normalized)) !== null) {
          if (match[0].startsWith('</')) {
            if (openTags.length > 0) openTags.pop();
          } else {
            openTags.push(match[1]);
          }
        }

        // Close any remaining unclosed tags at the end
        while (openTags.length > 0) {
          openTags.pop();
          normalized += '</s>';
        }

        return normalized;
      }
    };

    // Concrete Translation Providers with Failover & Backoff
    const TranslationProviders = {
      async fetchWithTimeout(url, options = {}, timeoutMs = 10000) {
        const controller = new AbortController();
        const timer = setTimeout(() => controller.abort(), timeoutMs);
        try {
          const res = await fetch(url, { ...options, signal: controller.signal });
          clearTimeout(timer);
          return res;
        } catch (e) {
          clearTimeout(timer);
          throw e;
        }
      },

      async sleep(ms) {
        return new Promise(r => setTimeout(r, ms));
      },

      // Google Resilient Provider: GTX + Dict + Exponential Backoff with Jitter
      async googleTranslate(text, targetLang, attempt = 0) {
        const encoded = encodeURIComponent(text);
        
        // Channel 1: Google GTX Single Endpoint
        try {
          const gtxUrl = `https://translate.googleapis.com/translate_a/single?client=gtx&sl=auto&tl=${encodeURIComponent(targetLang)}&dt=t&q=${encoded}`;
          const res = await this.fetchWithTimeout(gtxUrl, {}, 8000);
          if (res.ok) {
            const data = await res.json();
            if (data && data[0]) {
              const resText = data[0].map(item => item[0]).join('');
              if (resText) return TagShieldingEngine.repairTags(resText);
            }
          }
          if (res.status === 429 && attempt < 2) {
            const jitter = Math.floor(Math.random() * 300);
            await this.sleep(500 * (attempt + 1) + jitter);
            return this.googleTranslate(text, targetLang, attempt + 1);
          }
        } catch (e) {}

        // Channel 2: Google Chrome Dict Endpoint Failover
        try {
          const dictUrl = `https://clients5.google.com/translate_a/t?client=dict-chrome-ex&sl=auto&tl=${encodeURIComponent(targetLang)}&q=${encoded}`;
          const res = await this.fetchWithTimeout(dictUrl, {}, 8000);
          if (res.ok) {
            const data = await res.json();
            if (data && Array.isArray(data) && data[0]) {
              const resText = Array.isArray(data[0]) ? data[0][0] : (typeof data[0] === 'string' ? data[0] : null);
              if (resText) return TagShieldingEngine.repairTags(resText);
            }
          }
        } catch (e) {}

        // Channel 3: MyMemory Public Backup
        try {
          const myMemoryUrl = `https://api.mymemory.translated.net/get?q=${encoded}&langpair=auto|${encodeURIComponent(targetLang)}`;
          const res = await this.fetchWithTimeout(myMemoryUrl, {}, 8000);
          if (res.ok) {
            const data = await res.json();
            const memText = data?.responseData?.translatedText;
            if (memText && 
                !memText.includes('MYMEMORY WARNING') && 
                !memText.includes('INVALID SOURCE LANGUAGE') && 
                memText.toUpperCase() !== text.toUpperCase()) {
              return TagShieldingEngine.repairTags(memText);
            }
          }
        } catch (e) {}

        return text;
      },

      // LLM Provider: DeepSeek, OpenAI, Kimi, SiliconFlow, Zhipu, etc.
      async llmTranslateBatch(texts, targetLang, customConfig) {
        if (!customConfig?.apiKey || texts.length === 0) return new Map();
        const cleanBase = (customConfig.baseUrl || 'https://api.deepseek.com').replace(/\/+$/, '');
        const url = cleanBase.endsWith('/chat/completions') ? cleanBase : `${cleanBase}/chat/completions`;

        const prompt = texts.map((t, idx) => `[${idx}] ${t}`).join('\n');
        const resultMap = new Map();

        try {
          const res = await this.fetchWithTimeout(url, {
            method: 'POST',
            headers: {
              'Content-Type': 'application/json',
              'Authorization': `Bearer ${customConfig.apiKey.trim()}`
            },
            body: JSON.stringify({
              model: customConfig.model || 'deepseek-chat',
              messages: [
                {
                  role: 'system',
                  content: `You are an expert UI/UX localization translator. Translate each numbered item to "${targetLang}".
Strict formatting and tag integrity rules:
1. Preserve all markup tags like <s id="0">...</s> or <span id="0">...</span> around their corresponding translated words without modifying id values or tag structure.
2. Preserve placeholders like {0}, {name}, %s, $1, #hashtag intact.
3. Capitalization rules:
   - Buttons, navigation items, page titles, table headers: Title Case (e.g. "Submit Form", "Settings", "Account Details").
   - Descriptions, alerts, helper notes: Sentence case (capitalize first letter only, preserve acronyms).
   - Acronyms (ID, API, URL, AI, VIP, FAQ, BTC): Always standard UPPERCASE.
4. Output format: Exactly one translated line per item with its number prefix "[0] ...", "[1] ...". Do not output markdown codeblocks, explanations, or notes.`
                },
                { role: 'user', content: prompt }
              ],
              temperature: 0.1
            })
          }, 18000);

          if (res.ok) {
            const data = await res.json();
            const content = data.choices?.[0]?.message?.content || '';
            const lines = content.split('\n');
            for (const line of lines) {
              const match = line.match(/^\[(\d+)\]\s*(.*)$/);
              if (match) {
                const idx = parseInt(match[1], 10);
                if (texts[idx]) {
                  const cleaned = TagShieldingEngine.repairTags(match[2].trim());
                  resultMap.set(texts[idx], cleaned);
                }
              }
            }
          }
        } catch (e) {
          console.warn('[LLM Batch Error]', e);
        }

        return resultMap;
      }
    };

    // Translation Pipeline Orchestrator
    const TranslationPipeline = {
      cache: new TranslationLRUCache(2000),

      guessSourceLang(text) {
        if (/[\u4e00-\u9fff]/.test(text)) return 'zh-CN';
        if (/[\u3040-\u309f\u30a0-\u30ff]/.test(text)) return 'ja';
        if (/[\uac00-\ud7af]/.test(text)) return 'ko';
        if (/[\u0400-\u04ff]/.test(text)) return 'ru';
        if (/[\u0600-\u06ff]/.test(text)) return 'ar';
        if (/[\u0e00-\u0e7f]/.test(text)) return 'th';
        if (/[a-zA-Z]/.test(text)) return 'en';
        return 'auto';
      },

      async translateSingle(text, targetLang) {
        const trimmed = (text || '').trim();
        if (!trimmed) return text;

        if (state.protectText !== false && DataProtectionEngine.isProtected(trimmed)) {
          return text;
        }

        // Check LRU cache
        const cacheKey = `${targetLang}:${trimmed}`;
        const cached = this.cache.get(cacheKey);
        if (cached) return cached;

        // Skip if pure numbers or punctuation
        if (!/[a-zA-Z\u4e00-\u9fff\u3040-\u309f\u30a0-\u30ff\uac00-\ud7af\u0400-\u04ff\u0600-\u06ff\u0e00-\u0e7f]/.test(trimmed)) {
          return text;
        }

        const srcLang = this.guessSourceLang(trimmed);
        if (srcLang === targetLang && !srcLang.startsWith('zh')) return trimmed;

        let result = await TranslationProviders.googleTranslate(trimmed, targetLang);
        if (result && result !== trimmed) {
          if (state.smartCasing !== false) {
            result = SmartCasingEngine.format(result, targetLang);
          }
          this.cache.set(cacheKey, result);
          return result;
        }

        return trimmed;
      },

      async translateBatch(texts, targetLang, customConfig, onProgress = null) {
        const uniqueTexts = Array.from(new Set(texts.map(t => (t || '').trim()).filter(Boolean)));
        const resultMap = new Map();

        // 1. Filter out protected texts, same-language texts, and cached hits
        const toTranslate = [];
        for (const t of uniqueTexts) {
          if (state.protectText !== false && DataProtectionEngine.isProtected(t)) {
            resultMap.set(t, t);
            continue;
          }
          const cacheKey = `${targetLang}:${t}`;
          const cached = this.cache.get(cacheKey);
          if (cached) {
            resultMap.set(t, cached);
            continue;
          }
          const src = this.guessSourceLang(t);
          if (src === targetLang && !src.startsWith('zh')) {
            resultMap.set(t, t);
            continue;
          }
          toTranslate.push(t);
        }

        let completedCount = resultMap.size;
        const totalCount = uniqueTexts.length;
        if (onProgress) onProgress(completedCount, totalCount);

        // 2. Custom LLM path (if configured)
        if (customConfig?.apiKey && toTranslate.length > 0) {
          const llmResults = await TranslationProviders.llmTranslateBatch(toTranslate, targetLang, customConfig);
          for (const [orig, trans] of llmResults.entries()) {
            if (trans && trans !== orig) {
              resultMap.set(orig, trans);
              this.cache.set(`${targetLang}:${orig}`, trans);
            }
          }
        }

        // 3. Fallback to resilient concurrent 1-to-1 requests for any remaining items
        const pending = toTranslate.filter(t => !resultMap.has(t));
        if (pending.length > 0) {
          const CONCURRENCY = 8;
          for (let i = 0; i < pending.length; i += CONCURRENCY) {
            const chunk = pending.slice(i, i + CONCURRENCY);
            await Promise.all(
              chunk.map(async (text) => {
                const trans = await this.translateSingle(text, targetLang);
                resultMap.set(text, trans);
                completedCount++;
                if (onProgress) onProgress(completedCount, totalCount);
              })
            );
          }
        }

        // 4. Post-processing: Normalize tags & Apply Smart Casing to all results
        for (const [key, val] of resultMap.entries()) {
          if (val) {
            let processed = TagShieldingEngine.repairTags(val);
            if (state.smartCasing !== false) {
              processed = SmartCasingEngine.format(processed, targetLang);
            }
            resultMap.set(key, processed);
          }
        }

        if (onProgress) onProgress(totalCount, totalCount);
        return resultMap;
      }
    };

    // Backward-compatible alias for existing callers
    const UITranslationEngine = TranslationPipeline;

    // =====================================================================
    // =====================================================================
    // MESSAGE BUS & ROUTER (MODULAR DISPATCH)
    // =====================================================================
    const MessageHandlers = {
      'app/initialized'(payload) {
        if (payload?.settings) {
          state.settings = payload.settings;
          const tr = state.settings.translation;
          if (tr?.pinnedLanguageCodes?.length > 0) state.pinnedCodes = [...tr.pinnedLanguageCodes];
          if (tr?.targetLanguage) state.targetLanguage = tr.targetLanguage;
          if (tr?.translateMode) state.translateMode = tr.translateMode;
          if (typeof tr?.protectText === 'boolean') state.protectText = tr.protectText;
          if (typeof tr?.preserveRichText === 'boolean') state.preserveRichText = tr.preserveRichText;
          if (typeof tr?.smartCasing === 'boolean') state.smartCasing = tr.smartCasing;
          const fl = state.settings.fill;
          if (fl?.fillLines?.length > 0) state.fillLines = [...fl.fillLines];
          if (fl?.fillPrefix !== undefined) state.fillPrefix = fl.fillPrefix;
          if (fl?.fillSuffix !== undefined) state.fillSuffix = fl.fillSuffix;
          if (state.settings.theme) {
            state.theme = state.settings.theme;
            applyTheme(state.theme);
          }
          if (state.settings.compression?.tinifyKeys?.length > 0) {
            setTimeout(() => refreshCompressQuotas(false), 200);
          }
        }
        if (payload?.selection) state.selection = payload.selection;
        render();
      },

      'selection/changed'(payload) {
        if (payload) state.selection = payload;
        // Selection changed on canvas: reset color offsets to 0 baseline for the new selection
        state.hue = 0;
        state.saturation = 0;
        state.lightness = 0;
        render();
      },

      async 'translation/do-translate'(payload, requestId) {
        const { targetLanguage, nodeTexts, preserveRichText } = payload;
        const isCustom = state.settings?.activeProviderId === 'custom-llm' || state.settings?.activeProviderId === 'deepseek';
        const customConfig = isCustom ? (state.settings?.customLlm || state.settings?.providerCredentials?.deepseek) : null;
        
        try {
          const rawTexts = nodeTexts.map(n => n.text);
          const onProgress = (current, total) => {
            state.translationProgress = { current, total };
            const btn = document.querySelector('.action-bar .btn-primary');
            if (btn && state.isTranslating) {
              btn.innerHTML = `<span class="spinner"></span> 正在翻译 (${current}/${total})...`;
            }
          };

          const resultMap = await TranslationPipeline.translateBatch(rawTexts, targetLanguage, customConfig, onProgress);
          const results = nodeTexts.map(n => {
            const origTrimmed = (n.text || '').trim();
            if (state.protectText !== false && DataProtectionEngine.isProtected(origTrimmed)) {
              return { id: n.id, translated: n.text, richStyles: n.richStyles };
            }
            let trans = resultMap.get(origTrimmed) || n.text;
            if (state.smartCasing !== false && trans) {
              trans = SmartCasingEngine.format(trans, targetLanguage);
            }
            return {
              id: n.id,
              translated: trans,
              richStyles: n.richStyles
            };
          });

          parent.postMessage({
            pluginMessage: {
              type: 'translation/apply-results',
              requestId,
              payload: { results, preserveRichText }

          }, '*');
        } catch (e) {
          parent.postMessage({
            pluginMessage: {
              type: 'task/failed',
              requestId,
              payload: { error: { message: e.message } }
            }
          }, '*');
        }
      },

      async 'translation/do-scheme-translate'(payload, requestId) {
        const { batches, preserveRichText } = payload;
        const isCustom = state.settings?.activeProviderId === 'custom-llm' || state.settings?.activeProviderId === 'deepseek';
        const customConfig = isCustom ? (state.settings?.customLlm || state.settings?.providerCredentials?.deepseek) : null;
        
        try {
          const allResults = [];
          const totalBatches = batches.length;
          let batchIdx = 0;

          for (const batch of batches) {
            batchIdx++;
            const rawTexts = batch.nodeTexts.map(n => n.text);
            const onProgress = (current, total) => {
              state.translationProgress = { current, total };
              const btn = document.querySelector('.action-bar .btn-primary');
              if (btn && state.isTranslating) {
                btn.innerHTML = `<span class="spinner"></span> 生成画板 [${batchIdx}/${totalBatches}] (${current}/${total})...`;
              }
            };

            const resultMap = await TranslationPipeline.translateBatch(rawTexts, batch.targetLanguage, customConfig, onProgress);
            const results = batch.nodeTexts.map(n => {
              const origTrimmed = (n.text || '').trim();
              if (state.protectText !== false && DataProtectionEngine.isProtected(origTrimmed)) {
                return { id: n.id, translated: n.text, richStyles: n.richStyles };
              }
              let trans = resultMap.get(origTrimmed) || n.text;
              if (state.smartCasing !== false && trans) {
                trans = SmartCasingEngine.format(trans, batch.targetLanguage);
              }
              return {
                id: n.id,
                translated: trans,
                richStyles: n.richStyles
              };
            });
            allResults.push(...results);
          }

          parent.postMessage({
            pluginMessage: {
              type: 'translation/apply-results',
              requestId,
              payload: { results: allResults, preserveRichText }
            }
          }, '*');
        } catch (e) {
          parent.postMessage({
            pluginMessage: {
              type: 'task/failed',
              requestId,
              payload: { error: { message: e.message } }
            }
          }, '*');
        }
      },

      'compression/test-api-result'(payload) {
        const { success, error, apiKey, compressionCount } = payload;
        if (success) {
          if (!state.settings.compression) state.settings.compression = {};
          if (!state.settings.compression.tinifyKeys) state.settings.compression.tinifyKeys = [];
          
          const existing = state.settings.compression.tinifyKeys.find(k => k.key === apiKey);
          if (existing) {
            existing.compressCount = compressionCount || 0;
          } else {
            state.settings.compression.tinifyKeys.push({ key: apiKey, compressCount: compressionCount || 0 });
          }
          saveCompressionSettings();
          render();
          parent.postMessage({ pluginMessage: { type: 'toast', payload: '✅ 添加成功！' } }, '*');
        } else {
          parent.postMessage({ pluginMessage: { type: 'toast', payload: error, error: true } }, '*');
        }
      },

      'compression/refresh-quotas-result'(payload) {
        const { keys = [], manual } = payload || {};
        if (state.settings?.compression?.tinifyKeys) {
          keys.forEach(k => {
            const match = state.settings.compression.tinifyKeys.find(x => x.key === k.key);
            if (match) {
              match.compressCount = k.compressCount;
            }
          });
          saveCompressionSettings();
          render();
        }
        if (manual) {
          parent.postMessage({ pluginMessage: { type: 'toast', payload: '✅ TinyPNG 额度已刷新' } }, '*');
        }
      },

      'compression/progress'(payload) {
        const { current, total, layerName, text, phase } = payload || {};
        if (!total) return;
        
        let pct = Math.round((current / total) * 100);
        if (phase === 'start') pct = 8;
        if (phase === 'packing') pct = 98;
        if (pct < 8 && phase !== 'start') pct = Math.max(8, pct);
        if (pct > 98 && phase !== 'packing') pct = 98;

        if (!state.compressProgress) state.compressProgress = {};
        state.compressProgress.percent = pct;
        state.compressProgress.current = current;
        state.compressProgress.total = total;
        state.compressProgress.layerName = layerName || '';
        state.compressProgress.text = text || '';

        // Instant direct DOM updates inside the button capsule
        const fillEl = document.getElementById('btn-progress-fill');
        if (fillEl) fillEl.style.width = `${pct}%`;

        const countEl = document.getElementById('btn-count-text');
        if (countEl) countEl.innerText = `${current}/${total}`;

        const statusEl = document.getElementById('btn-status-text');
        if (statusEl) statusEl.innerText = text || (layerName ? `正在处理: ${layerName}` : `正在并发处理 (${current}/${total})`);
      },

      'compression/quota-update'(payload) {
        const { apiKey, count } = payload;
        if (state.settings.compression?.tinifyKeys) {
          const k = state.settings.compression.tinifyKeys.find(x => x.key === apiKey);
          if (k) { k.compressCount = count; saveCompressionSettings(); render(); }
        }
      },

      async 'compression/done'(payload) {
        if (compressTimerInterval) clearInterval(compressTimerInterval);
        const { items, zipName, error } = payload;
        const btn = document.getElementById('export-btn');
        
        if (error || !items || items.length === 0) {
          if (btn) {
            btn.innerHTML = `<span style="width: 100%; text-align: center;">${error ? `❌ ${error}` : '❌ 导出失败'}</span>`;
            btn.style.background = '#F24822';
            btn.style.border = '1px solid #F24822';
            btn.style.color = '#fff';
            setTimeout(() => { state.isCompressing = false; render(); }, 2500);
          } else {
            state.isCompressing = false; render();
          }
          return;
        }

        try {
          const countEl = document.getElementById('btn-count-text');
          if (countEl) countEl.innerText = `${items.length}/${items.length}`;
          const fillEl = document.getElementById('btn-progress-fill');
          if (fillEl) fillEl.style.width = '100%';
          const statusEl = document.getElementById('btn-status-text');
          if (statusEl) statusEl.innerText = '正在启动下载...';

          const zip = new JSZip();
          const folder = zip.folder(zipName || 'VolcBox_Export');
          for (let i = 0; i < items.length; i++) {
            folder.file(`${items[i].name}.${items[i].format.toLowerCase()}`, items[i].bytes);
          }
          
          if (items.length === 1 && !zipName) {
            const ext = items[0].format.toLowerCase();
            const blob = new Blob([items[0].bytes], { type: items[0].format === 'JPG' ? 'image/jpeg' : 'image/png' });
            const url = window.URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `${items[0].name}.${ext}`;
            a.click();
            window.URL.revokeObjectURL(url);
          } else {
            const blob = await zip.generateAsync({ type: 'blob', compression: 'STORE' });
            const url = window.URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `${zipName || 'VolcBox_Export'}.zip`;
            a.click();
            window.URL.revokeObjectURL(url);
          }
          
          if (btn) {
            btn.innerHTML = `<span style="width: 100%; text-align: center;">✅ 导出完成 (共 ${items.length} 个)</span>`;
            btn.style.background = '#1DA15F';
            btn.style.border = '1px solid #1DA15F';
            btn.style.color = '#fff';
            setTimeout(() => { state.isCompressing = false; render(); refreshCompressQuotas(false); }, 2000);
          } else {
            state.isCompressing = false; render(); refreshCompressQuotas(false);
          }
        } catch (err) {
          console.error(err);
          if (btn) {
            btn.innerHTML = `<span style="width: 100%; text-align: center;">❌ 打包失败</span>`;
            btn.style.background = '#F24822';
            btn.style.border = '1px solid #F24822';
            btn.style.color = '#fff';
            setTimeout(() => { state.isCompressing = false; render(); }, 2500);
          } else {
            state.isCompressing = false; render();
          }
        }
      },

      'crop/completed'(payload) {
        state.isCropping = false;
        const btn = document.getElementById('btn-trim-png');
        if (btn) {
          btn.disabled = state.selection.totalSelected === 0;
          btn.textContent = '执行';
        }
      },

      async 'crop/do-trim-images'(payload) {
        const { images } = payload || {};
        if (!images || images.length === 0) {
          state.isCropping = false;
          const btn = document.getElementById('btn-trim-png');
          if (btn) { btn.disabled = state.selection.totalSelected === 0; btn.textContent = '执行'; }
          return;
        }

        const ALPHA_THRESHOLD = 10; // Ignore faint invisible noise (< 4% opacity)

        for (const item of images) {
          const { nodeId, bytes, type, nodeType } = item;
          const blob = new Blob([bytes], { type: 'image/png' });
          const url = URL.createObjectURL(blob);
          const img = new Image();

          await new Promise((resolve) => {
            img.onload = () => {
              const w = img.width;
              const h = img.height;
              const canvas = document.createElement('canvas');
              canvas.width = w;
              canvas.height = h;
              const ctx = canvas.getContext('2d', { willReadFrequently: true });
              ctx.drawImage(img, 0, 0);

              const imgData = ctx.getImageData(0, 0, w, h);
              const data = imgData.data;

              // 1. Scan Top
              let top = 0;
              topLoop: for (let y = 0; y < h; y++) {
                for (let x = 0; x < w; x++) {
                  if (data[(y * w + x) * 4 + 3] > ALPHA_THRESHOLD) {
                    top = y;
                    break topLoop;
                  }
                }
                top = h;
              }

              // All transparent
              if (top >= h) {
                parent.postMessage({
                  pluginMessage: {
                    type: 'toast',
                    payload: '💡 该图层为全透明图层，无需裁切'
                  }
                }, '*');
                URL.revokeObjectURL(url);
                state.isCropping = false;
                const btn = document.getElementById('btn-trim-png');
                if (btn) { btn.disabled = false; btn.textContent = '执行'; }
                resolve();
                return;
              }

              // 2. Scan Bottom
              let bottom = h - 1;
              bottomLoop: for (let y = h - 1; y >= top; y--) {
                for (let x = 0; x < w; x++) {
                  if (data[(y * w + x) * 4 + 3] > ALPHA_THRESHOLD) {
                    bottom = y;
                    break bottomLoop;
                  }
                }
              }

              // 3. Scan Left
              let left = 0;
              leftLoop: for (let x = 0; x < w; x++) {
                for (let y = top; y <= bottom; y++) {
                  if (data[(y * w + x) * 4 + 3] > ALPHA_THRESHOLD) {
                    left = x;
                    break leftLoop;
                  }
                }
                left = w;
              }

              // 4. Scan Right
              let right = w - 1;
              rightLoop: for (let x = w - 1; x >= left; x--) {
                for (let y = top; y <= bottom; y++) {
                  if (data[(y * w + x) * 4 + 3] > ALPHA_THRESHOLD) {
                    right = x;
                    break rightLoop;
                  }
                }
              }

              const topTrim = top;
              const bottomTrim = h - 1 - bottom;
              const leftTrim = left;
              const rightTrim = w - 1 - right;

              const hasTrim = topTrim > 0 || bottomTrim > 0 || leftTrim > 0 || rightTrim > 0;

              if (hasTrim) {
                const cropW = right - left + 1;
                const cropH = bottom - top + 1;
                const cropCanvas = document.createElement('canvas');
                cropCanvas.width = cropW;
                cropCanvas.height = cropH;
                const cropCtx = cropCanvas.getContext('2d');
                cropCtx.drawImage(canvas, left, top, cropW, cropH, 0, 0, cropW, cropH);

                cropCanvas.toBlob(async (cropBlob) => {
                  const newBytes = new Uint8Array(await cropBlob.arrayBuffer());
                  parent.postMessage({
                    pluginMessage: {
                      type: 'crop/apply-trimmed-image',
                      payload: {
                        nodeId,
                        newBytes,
                        origW: w,
                        origH: h,
                        cropX: left,
                        cropY: top,
                        cropW,
                        cropH,
                        topTrim,
                        bottomTrim,
                        leftTrim,
                        rightTrim,
                        type,
                        nodeType
                      }
                    }
                  }, '*');
                  URL.revokeObjectURL(url);
                  resolve();
                }, 'image/png');
              } else {
                parent.postMessage({
                  pluginMessage: {
                    type: 'toast',
                    payload: '💡 该图片四周已紧密贴边，没有多余透明边缘'
                  }
                }, '*');
                URL.revokeObjectURL(url);
                state.isCropping = false;
                const btn = document.getElementById('btn-trim-png');
                if (btn) {
                  btn.disabled = false;
                  btn.textContent = '执行';
                }
                resolve();
              }
            };
            img.onerror = () => {
              URL.revokeObjectURL(url);
              state.isCropping = false;
              const btn = document.getElementById('btn-trim-png');
              if (btn) { btn.disabled = false; btn.textContent = '执行'; }
              resolve();
            };
            img.src = url;
          });
        }
      },

      async 'export/completed-artboards'(payload) {
        const { items, zipName } = payload || {};
        if (!items || items.length === 0) return;

        try {
          if (items.length === 1) {
            const blob = new Blob([new Uint8Array(items[0].bytes)], { type: 'image/png' });
            const url = window.URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `${items[0].name}.png`;
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            window.URL.revokeObjectURL(url);
          } else {
            const zip = new JSZip();
            for (const item of items) {
              zip.file(`${item.name}.png`, item.bytes);
            }
            const zipBlob = await zip.generateAsync({ type: 'blob' });
            const url = window.URL.createObjectURL(zipBlob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `${zipName || '所选画板切图'}.zip`;
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            window.URL.revokeObjectURL(url);
          }
        } catch (e) {
          console.error('[Download Artboards Error]', e);
        }
      },

      async 'artboards/do-local-image-clipboard'(payload) {
        const { rows, images, withTitles } = payload || {};
        const imageRows = rows || (images ? [images] : []);
        if (!imageRows || imageRows.length === 0) return;

        try {
          const loadedRows = await Promise.all(
            imageRows.map(row => Promise.all(
              row.map(item => new Promise((resolve, reject) => {
                const blob = new Blob([item.bytes], { type: 'image/png' });
                const url = URL.createObjectURL(blob);
                const img = new Image();
                img.onload = () => resolve({ img, name: item.name, width: item.width, height: item.height, url });
                img.onerror = reject;
                img.src = url;
              }))
            ))
          );

          const titleHeight = withTitles ? 40 : 0;
          const gap = 36;
          const pad = 40;

          const rowWidths = loadedRows.map(row => {
            const totalImgsW = row.reduce((sum, item) => sum + item.width, 0);
            return totalImgsW + (row.length - 1) * gap;
          });
          const rowHeights = loadedRows.map(row => {
            const maxH = Math.max(...row.map(item => item.height));
            return maxH + titleHeight;
          });

          const maxRowWidth = Math.max(...rowWidths);
          const totalWidth = maxRowWidth + pad * 2;
          const totalHeight = rowHeights.reduce((sum, h) => sum + h, 0) + (loadedRows.length - 1) * gap + pad * 2;

          const canvas = document.createElement('canvas');
          canvas.width = totalWidth;
          canvas.height = totalHeight;
          const ctx = canvas.getContext('2d');

          ctx.fillStyle = '#F4F4F5';
          ctx.fillRect(0, 0, totalWidth, totalHeight);

          let curY = pad;
          for (let r = 0; r < loadedRows.length; r++) {
            const row = loadedRows[r];
            let curX = pad;

            for (let i = 0; i < row.length; i++) {
              const imgItem = row[i];
              const x = curX;
              const y = curY;

              if (withTitles) {
                ctx.fillStyle = '#18181B';
                ctx.font = 'bold 20px -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang SC", sans-serif';
                ctx.textBaseline = 'middle';
                ctx.fillText(imgItem.name, x, y + 16);
              }

              const imgY = y + titleHeight;

              ctx.save();
              ctx.shadowColor = 'rgba(0, 0, 0, 0.08)';
              ctx.shadowBlur = 16;
              ctx.shadowOffsetY = 6;
              ctx.fillStyle = '#FFFFFF';
              ctx.fillRect(x, imgY, imgItem.width, imgItem.height);
              ctx.restore();

              ctx.drawImage(imgItem.img, x, imgY, imgItem.width, imgItem.height);

              ctx.strokeStyle = 'rgba(0, 0, 0, 0.08)';
              ctx.lineWidth = 1;
              ctx.strokeRect(x, imgY, imgItem.width, imgItem.height);

              curX += imgItem.width + gap;
            }

            curY += rowHeights[r] + gap;
          }

          loadedRows.flat().forEach(i => URL.revokeObjectURL(i.url));

          const dataUrl = canvas.toDataURL('image/png');

          const response = await fetch('http://127.0.0.1:3055/api/clipboard/write-image', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ imageBase64: dataUrl })
          });

          if (response.ok) {
            parent.postMessage({ pluginMessage: { type: 'toast', payload: '📋 拼图大图已直接复制到剪贴板，去微信按 ⌘+V 即可粘贴发送！' } }, '*');
          } else {
            throw new Error('Local helper error');
          }
        } catch (err) {
          console.error('[Local Collage Error]', err);
          parent.postMessage({ pluginMessage: { type: 'toast', payload: '复制失败，请确认本地服务已启动', error: true } }, '*');
        }
      },

      async 'artboards/do-local-files-clipboard'(payload) {
        const { files } = payload || {};
        if (!files || files.length === 0) return;

        try {
          const filesPayload = await Promise.all(
            files.map(f => new Promise((resolve) => {
              const blob = new Blob([new Uint8Array(f.bytes)], { type: 'image/png' });
              const reader = new FileReader();
              reader.onloadend = () => {
                resolve({
                  name: f.name,
                  base64: reader.result
                });
              };
              reader.readAsDataURL(blob);
            }))
          );

          const response = await fetch('http://127.0.0.1:3055/api/clipboard/write-files', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ files: filesPayload })
          });

          if (response.ok) {
            parent.postMessage({
              pluginMessage: {
                type: 'toast',
                payload: `📋 ${files.length} 张单图已直接复制到剪贴板，去微信按 ⌘+V 可一次性发出 ${files.length} 条消息！`
              }
            }, '*');
          } else {
            throw new Error('Local helper error');
          }
        } catch (err) {
          console.error('[Local Files Error]', err);
          parent.postMessage({ pluginMessage: { type: 'toast', payload: '多图复制失败，请确认本地服务已启动', error: true } }, '*');
        }
      },

      'account/sync-status-updated'(payload) {
        const { success, settings, cloudSync, message, error } = payload || {};
        if (success) {
          if (settings) {
            state.settings = settings;
            const tr = state.settings.translation;
            if (tr?.pinnedLanguageCodes?.length > 0) state.pinnedCodes = [...tr.pinnedLanguageCodes];
            if (tr?.targetLanguage) state.targetLanguage = tr.targetLanguage;
            if (tr?.translateMode) state.translateMode = tr.translateMode;
            if (typeof tr?.protectText === 'boolean') state.protectText = tr.protectText;
            if (typeof tr?.preserveRichText === 'boolean') state.preserveRichText = tr.preserveRichText;
            if (typeof tr?.smartCasing === 'boolean') state.smartCasing = tr.smartCasing;
            const fl = state.settings.fill;
            if (fl?.fillLines?.length > 0) state.fillLines = [...fl.fillLines];
            if (fl?.fillPrefix !== undefined) state.fillPrefix = fl.fillPrefix;
            if (fl?.fillSuffix !== undefined) state.fillSuffix = fl.fillSuffix;
          } else if (cloudSync) {
            if (!state.settings) state.settings = {};
            state.settings.cloudSync = cloudSync;
          }
          render();
        } else {
          render();
        }
      },

      'task/completed'() {
        state.isTranslating = false;
        state.translationProgress = null;
        render();
      },

      'task/failed'() {
        state.isTranslating = false;
        state.translationProgress = null;
        render();
      }
    };

    window.onmessage = async (event) => {
      const msg = event.data?.pluginMessage;
      if (!msg || !msg.type) return;
      const handler = MessageHandlers[msg.type];
      if (typeof handler === 'function') {
        try {
          await handler(msg.payload, msg.requestId);
        } catch (err) {
          console.error(`[Message Router Error] ${msg.type}:`, err);
        }
      }
    };

    // Global click listener to close modals when clicking backdrop
    document.addEventListener('click', (e) => {
      if (e.target && e.target.classList && e.target.classList.contains('modal-overlay')) {
        const lp = document.getElementById('lang-picker-modal');
        if (lp && lp.style.display !== 'none') {
          closeLangPicker();
        }
        if (state.editingScheme) {
          state.editingScheme = null;
          render();
        }
        if (state.editingPreset) {
          state.editingPreset = null;
          render();
        }
      }
      const menu = document.getElementById('preset-context-menu');
      if (menu && menu.style.display !== 'none' && !menu.contains(e.target)) {
        menu.style.display = 'none';
      }
    });

    // Initial render & local service check
    render();
    checkLocalService();
    setInterval(checkLocalService, 3000);
    parent.postMessage({ pluginMessage: { type: 'selection/request', payload: {} } }, '*');
  </script>
</body>
</html>
